name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - run: pip install -r backend/requirements.txt
      - name: Dataset manifest checks and recorded-results verification
        run: |
          python -m lungai.data.validate --skip-files --out /tmp/data_validation || true
          python -m lungai.evaluation.historical --out /tmp/eval_reports
      - name: Tests (checkpoint-dependent tests skip when models/ is empty)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: CI=true npx react-scripts test --watchAll=false
      - run: CI=true npm run build
