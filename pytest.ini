[pytest]
testpaths = tests backend/tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_default_fixture_loop_scope = function
markers =
    needs_checkpoint: requires the canonical checkpoint in models/ (skipped when absent)
    needs_data: requires the dataset images under LUNGAI_DATA_ROOT (skipped when absent)
